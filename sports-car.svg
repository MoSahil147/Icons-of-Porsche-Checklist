<title id="t">Brick-built Porsche 911 Carrera (992), side view, scale 1:12</title>
<desc id="d">Original fan art. A red 911 coupe built from plates, about 47 studs long and 34 plates high, on a grey studded baseplate. Each plate row ends on the real outline of the car, traced from a scaled side elevation.</desc>
