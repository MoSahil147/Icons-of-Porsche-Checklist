<!DOCTYPE html>
<!-- Source of og.png (1200 x 630). Regenerate from the repo root:
     chromium --headless --hide-scrollbars --virtual-time-budget=5000 --window-size=1200,630 --screenshot=og.png "file://$PWD/tools/og.html" -->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>og image</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--color-paper); color: var(--color-ink); }
    .card { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; }
    h1 { margin: 0; max-width: 760px; font: 800 92px/0.95 var(--font-display); letter-spacing: -0.03em; }
    p { margin: 24px 0 0; font: 600 30px/1.3 var(--font-body); color: var(--color-ink-2); }
    img { position: absolute; left: 110px; bottom: 30px; width: 980px; height: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Every tick builds your 911.</h1>
    <p>A fan-made guide for Icons of Porsche Dubai, 21 and 22 November</p>
    <img src="../sports-car.svg" alt="">
  </div>
</body>
</html>
